[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nakshatra-ai"
version = "0.4.0"
description = "Explainable AI powered Vedic Astrology Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nakshatra AI contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "pyswisseph>=2.10.3.2,<3",
  "typer>=0.15,<1",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.125,<7",
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
nakshatra = "nakshatra.cli.app:app"
nakshatra-web = "nakshatra.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nakshatra"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=nakshatra --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nakshatra"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nakshatra"]
